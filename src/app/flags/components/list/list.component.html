<div class="p-4 flex justify-center">
  <mat-form-field class="w-1/3">
    <mat-label>Buscar país...</mat-label>
    <input
      matInput
      type="text"
      [(ngModel)]="searchTerm"
    />
  </mat-form-field>
</div>

<div class="grid gap-4 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
  <div
    *ngFor="let country of ciudadesFiltradas"
    class="rounded-lg p-4 shadow hover:shadow-md transition border-4 mx-4"
    [ngClass]="'border ' + getBorderColor(country.region)"
    (click)="irInfo(country)"
  >
    <h2 class="text-lg font-semibold mb-2">{{ country.name.common }}</h2>
    <img
      [src]="country.flags.png"
      [alt]="country.flags.alt || country.name.common"
      class="w-full h-auto rounded"
    />
  </div>
</div>
